name: Verify SDK release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ORGX_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.ORGX_CI_RUNNER && 135 || 10 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/registry_preflight.py pypi
