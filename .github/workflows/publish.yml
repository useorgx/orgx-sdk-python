name: Publish orgx to PyPI

on:
  push:
    tags: ['v*']
    branches: ['release/v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/registry_preflight.py pypi --publish
      - name: Require release ref and package version to agree
        run: python -c 'import os,tomllib; assert os.environ["GITHUB_REF_NAME"].removeprefix("release/") == "v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]'
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
