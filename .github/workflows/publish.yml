name: Publish orgx to PyPI

on:
  push:
    tags: ['v*']
    branches: ['release/v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/registry_preflight.py pypi --publish
      - name: Require release ref and package version to agree
        run: python -c 'import os,tomllib; assert os.environ["GITHUB_REF_NAME"].removeprefix("release/") == "v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]'
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
